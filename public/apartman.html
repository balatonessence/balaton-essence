<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartman Részletek | Balaton Essence</title>
    <link rel="icon" type="image/png" href="img/bebetolto.png">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #FCFBF9;
            --bg-alt: #F4F2EC;
            --text: #2C3325;
            --text-light: #6A7063;
            --accent: #5C7A4D;
            --accent-hover: #48613A;
            --gold: #C8A46B;
            --gold-soft: rgba(200, 164, 107, 0.28);
            --border: #E3E0D8;
            --warning: #B0413E;
            --dark: #172318;
            --shadow: rgba(44, 51, 37, 0.08);
            --transition: all 0.45s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        a {
            color: inherit;
        }

        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 2000;
            padding: 1.6rem 6vw;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(
                to bottom,
                rgba(10, 16, 12, 0.68),
                rgba(10, 16, 12, 0.15)
            );
            transition: 0.3s ease;
        }

        .site-header.scrolled {
            background: rgba(23, 35, 24, 0.95);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-top: 1rem;
            padding-bottom: 1rem;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
            text-decoration: none;
            color: white;
        }

        .logo-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 7px;
            color: white;
        }

        .logo-subtitle {
            font-size: 0.64rem;
            font-weight: 400;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.78);
            margin-top: 0.35rem;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2.4rem;
        }

        .nav-links a {
            text-decoration: none;
            color: rgba(255,255,255,0.92);
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.25s ease;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        main {
            max-width: 1320px;
            margin: 0 auto 100px;
            padding: 9.5rem 6vw 0;
        }

        .apt-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 3rem;
        }

        @media (min-width: 992px) {
            .apt-container {
                grid-template-columns: 1.6fr 0.9fr;
                gap: 5rem;
                align-items: start;
            }
        }

        .apt-location-tag {
            text-transform: uppercase;
            letter-spacing: 2.8px;
            color: var(--gold);
            font-weight: 800;
            font-size: 0.72rem;
            margin-bottom: 1rem;
        }

        .apt-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 5vw, 5.2rem);
            font-style: normal;
            font-weight: 400;
            margin-bottom: 1.2rem;
            line-height: 1.05;
            color: var(--text);
        }

        .apt-address-box {
            display: none;
            background: white;
            border: 1px solid var(--border);
            border-left: 4px solid var(--gold);
            border-radius: 6px;
            padding: 1rem 1.2rem;
            margin-top: 1.3rem;
            max-width: 620px;
            box-shadow: 0 18px 45px rgba(44, 51, 37, 0.05);
        }

        .apt-address-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-light);
            font-weight: 800;
            margin-bottom: 0.35rem;
        }

        .apt-address-value {
            font-size: 0.95rem;
            color: var(--text);
            line-height: 1.5;
        }

        .main-image-wrapper {
            margin: 3rem 0 2.5rem;
            box-shadow: 0 35px 90px rgba(44, 51, 37, 0.16);
            border-radius: 4px;
            overflow: hidden;
            background: #eee;
            aspect-ratio: 16 / 10;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
            margin-top: 3rem;
        }

        .img-container {
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
            box-shadow: 0 18px 45px rgba(44, 51, 37, 0.08);
        }

        .gallery-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
            transition: var(--transition);
            display: block;
        }

        .gallery-img:hover {
            transform: scale(1.035);
            opacity: 0.92;
        }

        #apt-desc {
            background: white;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 2rem;
            box-shadow: 0 22px 65px rgba(44, 51, 37, 0.06);
            margin-top: 2.5rem !important;
            font-size: 1rem !important;
            line-height: 1.8 !important;
            color: #4f554a !important;
        }

        .booking-card {
            background: white;
            border: 1px solid var(--border);
            padding: 2.8rem 2.5rem;
            position: sticky;
            top: 120px;
            box-shadow: 0 30px 80px rgba(44, 51, 37, 0.12);
            border-radius: 6px;
        }

        .booking-card h3 {
            font-family: 'Playfair Display', serif !important;
            font-size: 2rem !important;
            font-style: normal !important;
            font-weight: 400 !important;
            margin-bottom: 1.2rem !important;
        }

        .price-tag {
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--text-light);
            margin-bottom: 1.5rem;
        }

        .price-num {
            font-weight: 900;
            color: var(--gold);
        }

        .price-old {
            display: block;
            color: #9a9a9a;
            text-decoration: line-through;
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 0.35rem;
            white-space: nowrap;
        }

        .price-sale {
            display: block;
            color: var(--warning);
            font-size: 1.35rem;
            font-weight: 900;
            line-height: 1.2;
            white-space: nowrap;
        }

        .apt-discount-box {
            display: none;
            background: rgba(176, 65, 62, 0.08);
            border: 1px solid rgba(176, 65, 62, 0.22);
            border-left: 4px solid var(--warning);
            border-radius: 10px;
            padding: 1rem 1.1rem;
            margin: 1rem 0 1.4rem;
        }

        .apt-discount-label {
            display: inline-flex;
            background: var(--warning);
            color: white;
            border-radius: 999px;
            padding: 0.35rem 0.75rem;
            font-size: 0.62rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 0.75rem;
        }

        .apt-discount-main {
            font-size: 0.9rem;
            color: var(--text);
            line-height: 1.55;
            font-weight: 600;
        }

        .apt-discount-small {
            font-size: 0.75rem;
            color: var(--text-light);
            line-height: 1.55;
            margin-top: 0.5rem;
        }

        .btn-booking {
            width: 100%;
            background: var(--accent);
            color: white;
            border: 1px solid var(--accent);
            padding: 1.1rem 1.4rem;
            border-radius: 4px;
            font-weight: 900;
            text-transform: uppercase;
            margin-top: 2rem;
            letter-spacing: 1.8px;
            font-size: 0.72rem;
            transition: 0.35s;
        }

        .btn-booking:not(:disabled) {
            cursor: pointer;
        }

        .btn-booking:not(:disabled):hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(44, 51, 37, 0.16);
        }

        .btn-booking:disabled {
            background: #EAE8E2;
            color: #888;
            border-color: #EAE8E2;
        }

        .dev-status {
            color: var(--text-light);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: none;
            letter-spacing: 0;
            line-height: 1.7;
            display: block;
        }

        .dev-status strong {
            color: var(--text);
        }

        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 15, 8, 0.98);
            z-index: 4000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .lightbox.active {
            opacity: 1;
            display: flex;
        }

        .lightbox-img {
            max-width: 90%;
            max-height: 85vh;
            object-fit: contain;
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .lightbox-close {
            position: absolute;
            top: 2.5rem;
            right: 2.5rem;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            opacity: 0.6;
            transition: 0.3s;
            z-index: 10001;
        }

        .lightbox-close:hover {
            opacity: 1;
            transform: rotate(90deg);
        }

        .lightbox-nav {
            position: absolute;
            color: white;
            font-size: 4rem;
            cursor: pointer;
            padding: 2rem;
            user-select: none;
            opacity: 0.3;
            transition: 0.3s;
            font-family: serif;
        }

        .lightbox-nav:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-prev {
            left: 0;
        }

        .nav-next {
            right: 0;
        }

        .cal-day {
            padding: 12px 0;
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
            border-radius: 4px;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .cal-day:hover:not(.empty):not(.past):not(.booked) {
            background: #f0f5ec;
            color: var(--accent);
        }

        .cal-day.past {
            color: #ccc;
            cursor: not-allowed;
            pointer-events: none;
        }

        .cal-day.booked {
            background-color: #ffeaea !important;
            color: #e74c3c !important;
            text-decoration: line-through;
            cursor: not-allowed;
            opacity: 0.7;
            pointer-events: none;
        }

        .cal-day.end-allowed {
            pointer-events: auto !important;
            cursor: pointer !important;
            opacity: 1;
            text-decoration: none !important;
            border: 1px dashed var(--accent);
        }

        .cal-day.end-allowed:hover {
            background: #f0f5ec !important;
            color: var(--accent) !important;
        }


        .cal-day.no-checkin,
        .cal-day.no-checkout,
        .cal-day.no-turnover {
            background: rgba(200, 164, 107, 0.14);
            color: #9A753B;
            border-color: rgba(200, 164, 107, 0.38);
        }

        .cal-day.no-checkin.past,
        .cal-day.no-checkout.past,
        .cal-day.no-turnover.past {
            opacity: 0.45;
        }

        .selected-start,
        .selected-end {
            background: var(--accent) !important;
            color: white !important;
            font-weight: bold;
            text-decoration: none !important;
        }

        .selected-range {
            background: var(--accent-soft) !important;
            color: var(--accent);
        }

        .custom-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 350px;
            width: 90%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            animation: popupAnim 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .success-icon {
            width: 60px;
            height: 60px;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 15px;
            transition: background 0.3s;
        }

        .btn-main {
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-top: 20px;
            transition: background 0.3s;
        }

         html {
            scrollbar-width: thin;
            scrollbar-color: #C8A46B transparent;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #C8A46B;
            border-radius: 999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #b28b52;
        }

        .plain-amp {
    font-family: Arial, sans-serif;
    font-style: normal;
    font-weight: inherit;
    font-size: 0.9em;
}

        @media (max-width: 820px) {
            .site-header {
                padding: 1rem 5vw;
                align-items: flex-start;
                background: rgba(23,35,24,0.94);
            }

            .logo-title {
                font-size: 1.35rem;
                letter-spacing: 4px;
            }

            .logo-subtitle {
                font-size: 0.55rem;
                letter-spacing: 3px;
            }

            .nav-links {
                justify-content: flex-end;
                flex-wrap: wrap;
                gap: 0.8rem;
            }

            .nav-links a {
                font-size: 0.62rem;
            }

            main {
                padding: 7.5rem 5vw 0;
            }

            .apt-title {
                font-size: clamp(2.4rem, 11vw, 3.6rem);
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }

            .booking-card {
                position: relative;
                top: auto;
                padding: 2rem 1.5rem;
            }
        }

        @keyframes popupAnim {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        #main-content {
            animation: fadeInPage 1s ease forwards;
        }

        @keyframes fadeInPage {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

    <link rel="stylesheet" href="mobile.css?v=3">
    <link rel="stylesheet" href="cookie-consent.css?v=2">
</head>

<body>

<header class="site-header" id="site-header">
    <a href="index.html" class="logo-container" aria-label="Balaton Essence főoldal">
        <span class="logo-title">BALATON</span>
        <span class="logo-subtitle">Essence</span>
    </a>

    <nav class="nav-links" aria-label="Fő navigáció">
        <a href="index.html#apartments">Szállások</a>
        <a href="index.html#services">Szolgáltatások</a>
        <a href="index.html#reviews-section">Élmények</a>
        <a href="ajanlasok.html">Journal</a>
        <a href="index.html#contact">Kapcsolat</a>
    </nav>
</header>

<main id="main-content" style="display: none;">
    <div class="apt-container">
        <div>
            <p id="apt-loc" class="apt-location-tag"></p>
            <h1 id="apt-name" class="apt-title"></h1>

            <div id="apt-address-box" class="apt-address-box">
                <div class="apt-address-label">Cím</div>
                <div id="apt-address" class="apt-address-value"></div>
            </div>

            <div class="main-image-wrapper">
                <img id="apt-main-img" src="" class="gallery-img" onclick="openLightbox(0)" alt="">
            </div>

            <div id="apt-gallery" class="gallery-grid"></div>

            <div id="apt-desc"></div>
        </div>

        <div>
            <div class="booking-card">
                <h3>Foglalás</h3>

                <p id="apt-price" class="price-tag"></p>

                <div id="apt-discount-box" class="apt-discount-box">
                    <div id="apt-discount-label" class="apt-discount-label"></div>
                    <div id="apt-discount-main" class="apt-discount-main"></div>
                    <div id="apt-discount-small" class="apt-discount-small"></div>
                </div>

                <div class="dev-status">
                    <span></span>
                    <span></span>
                </div>

                <hr style="border: 0; border-top: 1px solid var(--border); margin: 2.5rem 0;">

                <button class="btn-booking" id="booking-btn" disabled>Foglalás</button>
            </div>
        </div>
    </div>
</main>

<div id="booking-modal" class="lightbox" style="display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 9999;">
    <div style="background: white; width: 90%; max-width: 500px; padding: 2.5rem; border-radius: 8px; position: relative; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2);">

        <span class="lightbox-close" onclick="closeBookingModal()" style="position: absolute; top: 1.5rem; right: 1.5rem; cursor: pointer; font-size: 1.2rem; color: #999;">✕</span>

        <h2 style="font-family: 'Playfair Display'; font-size: 1.8rem; margin-bottom: 0.5rem;">Foglalási adatok</h2>
        <p id="modal-apt-name" style="color: var(--accent); font-weight: 700; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; margin-bottom: 2rem;"></p>

        <div style="margin-bottom: 1.5rem;">
            <label style="font-size: 0.7rem; font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 10px; color: var(--text-light);">Időszak kiválasztása</label>

            <div id="custom-calendar" style="border: 1px solid var(--border); padding: 15px; border-radius: 4px; background: #fff;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <button onclick="changeMonth(-1)" style="border:none; background:none; cursor:pointer; font-size: 1.2rem; color: var(--accent);">‹</button>
                    <div id="calendar-month-year" style="font-weight: 700; font-family: 'Playfair Display';"></div>
                    <button onclick="changeMonth(1)" style="border:none; background:none; cursor:pointer; font-size: 1.2rem; color: var(--accent);">›</button>
                </div>

                <div style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.6rem; font-weight: 700; color: #999; margin-bottom: 10px;">
                    <div>HÉ</div>
                    <div>KE</div>
                    <div>SZE</div>
                    <div>CSÜ</div>
                    <div>PÉ</div>
                    <div>SZO</div>
                    <div>VAS</div>
                </div>

                <div id="calendar-days" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;"></div>
            </div>

            <div style="display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.8rem; background: var(--bg); padding: 10px; border-radius: 4px;">
                <span>Érkezés: <strong id="display-start">-</strong></span>
                <span>Távozás: <strong id="display-end">-</strong></span>
            </div>
        </div>

        <input type="hidden" id="book-start">
        <input type="hidden" id="book-end">

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 1.5rem; align-items: start;">
            <div class="form-group">
                <label style="font-size: 0.7rem; font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 5px;">Vendégek</label>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                    <div>
                        <label style="font-size:0.62rem; font-weight:800; color:var(--text-light); text-transform:uppercase; display:block; margin-bottom:4px;">Felnőtt</label>
                        <div style="display:flex; align-items:center; justify-content:space-between; height:52px; border:1px solid var(--border); border-radius:6px; background:#fff; overflow:hidden;">
                            <button type="button" onclick="changeBookingGuests('adults', -1)" style="width:54px; height:52px; border:none; background:rgba(42,48,43,0.06); color:var(--primary); font-size:1.45rem; font-weight:800; cursor:pointer; touch-action:manipulation;">−</button>
                            <span id="book-adults-display" style="flex:1; text-align:center; font-size:1.05rem; font-weight:800; color:var(--primary);">2</span>
                            <button type="button" onclick="changeBookingGuests('adults', 1)" style="width:54px; height:52px; border:none; background:rgba(42,48,43,0.06); color:var(--primary); font-size:1.45rem; font-weight:800; cursor:pointer; touch-action:manipulation;">+</button>
                        </div>
                        <input type="hidden" id="book-adults" value="2">
                    </div>

                    <div>
                        <label style="font-size:0.62rem; font-weight:800; color:var(--text-light); text-transform:uppercase; display:block; margin-bottom:4px;">Gyerek</label>
                        <div style="display:flex; align-items:center; justify-content:space-between; height:52px; border:1px solid var(--border); border-radius:6px; background:#fff; overflow:hidden;">
                            <button type="button" onclick="changeBookingGuests('children', -1)" style="width:54px; height:52px; border:none; background:rgba(42,48,43,0.06); color:var(--primary); font-size:1.45rem; font-weight:800; cursor:pointer; touch-action:manipulation;">−</button>
                            <span id="book-children-display" style="flex:1; text-align:center; font-size:1.05rem; font-weight:800; color:var(--primary);">0</span>
                            <button type="button" onclick="changeBookingGuests('children', 1)" style="width:54px; height:52px; border:none; background:rgba(42,48,43,0.06); color:var(--primary); font-size:1.45rem; font-weight:800; cursor:pointer; touch-action:manipulation;">+</button>
                        </div>
                        <input type="hidden" id="book-children" value="0">
                    </div>
                </div>

<script src="database.js?v=16.5"></script>
<script src="https://js.stripe.com/v3/"></script>

<script>
    let currentApt = null;
    let allImages = [];
    let currentIndex = 0;

    let calDate = new Date();
    let selectedStart = null;
    let selectedEnd = null;

    const STRIPE_PUBLISHABLE_KEY = 'pk_test_51TNXrwDl2yIAVe6MOBaUkGKD4MrGaqmjIIoXoIBn0rv8k5bOvltbv54KG0I5b0CGUvtWSIbn0BrouzkqsgX0XZAn00DoG5W0l0';

    const MIN_BOOKING_HOURS_AHEAD = 48;
    const CHECK_IN_HOUR = 14;

    function initHeaderScroll() {
        const header = document.getElementById('site-header');

        if (!header) return;

        const update = () => {
            if (window.scrollY > 20) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        };

        update();
        window.addEventListener('scroll', update);
    }

    function getCheckInDateTime(dateStr) {
        const date = parseLocalDate(dateStr);

        if (!date || isNaN(date.getTime())) {
            return null;
        }

        date.setHours(CHECK_IN_HOUR, 0, 0, 0);
        return date;
    }

    function isCheckInAllowedByLeadTime(dateStr) {
        const checkInDateTime = getCheckInDateTime(dateStr);

        if (!checkInDateTime) {
            return false;
        }

        const minimumAllowedDateTime = new Date();
        minimumAllowedDateTime.setHours(
            minimumAllowedDateTime.getHours() + MIN_BOOKING_HOURS_AHEAD
        );

        return checkInDateTime >= minimumAllowedDateTime;
    }



    function getApartmanImages(apt) {
        if (!apt) return [];

        const candidates = [];

        if (apt.coverImage) candidates.push(apt.coverImage);
        if (apt.image) candidates.push(apt.image);

        ['galleryImages', 'images', 'gallery'].forEach(key => {
            if (Array.isArray(apt[key])) {
                candidates.push(...apt[key]);
            }
        });

        const seen = new Set();

        return candidates
            .map(value => String(value || '').trim())
            .filter(Boolean)
            .filter(src => {
                if (seen.has(src)) return false;
                seen.add(src);
                return true;
            });
    }

    async function loadPublicApartmentData(id) {
        const timestamp = Date.now();
        const response = await fetch(`/api/public-apartment/${encodeURIComponent(id)}?t=${timestamp}`, {
            cache: 'no-store'
        });

        if (!response.ok) {
            throw new Error('Apartment data loading failed');
        }

        const payload = await response.json();
        const apartment = payload.apartment || null;

        db = {
            apartments: apartment ? [apartment] : [],
            bookings: Array.isArray(payload.bookings) ? payload.bookings : [],
            owners: Array.isArray(payload.owners) ? payload.owners : [],
            extras: Array.isArray(payload.extras) ? payload.extras : []
        };

        return apartment;
    }

    document.addEventListener('DOMContentLoaded', async () => {
        initHeaderScroll();

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        if (!id) {
            window.location.href = 'index.html';
            return;
        }

        try {
            currentApt = await loadPublicApartmentData(id);

            if (currentApt) {
                allImages = getApartmanImages(currentApt);

                renderDetails();
                updateSEO(
                    currentApt.name || 'Apartman',
                    currentApt.location || 'Balaton'
                );

                const mainContent = document.getElementById('main-content');
                if (mainContent) {
                    mainContent.style.display = 'block';
                }
            } else {
                window.location.href = 'index.html';
            }
        } catch (error) {
            console.error('Apartment loading error:', error);
            window.location.href = 'index.html';
        }
    });

    function formatApartmentName(value) {
        return decodeHtmlEntities(value || '')
            .replace(/&/g, '<span class="plain-amp">&amp;</span>');
    }

    function decodeHtmlEntities(value) {
        const textarea = document.createElement('textarea');
        textarea.innerHTML = String(value ?? '');
        return textarea.value;
    }

    

    function getLocalDateString(date) {
        const d = new Date(date);
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function parseLocalDate(dateStr) {
        if (!dateStr) return null;

        const parts = String(dateStr).split('-').map(Number);

        if (parts.length !== 3 || parts.some(Number.isNaN)) {
            return null;
        }

        return new Date(parts[0], parts[1] - 1, parts[2]);
    }

    function getAptStatusAndPrice(apt, date, guests = 2) {
    if (!apt) {
        return {
            status: 'CLOSED',
            price: 0,
            label: '',
            minNights: 1,
            maxGuests: 2
        };
    }

    const dateStr = getLocalDateString(date);
    const guestCount = Number(guests || 2);

    const season = Array.isArray(apt.seasons)
        ? apt.seasons.find(s => dateStr >= s.start && dateStr <= s.end)
        : null;

    if (!season) {
        return {
            status: 'CLOSED',
            price: 0,
            label: '',
            minNights: 1,
            maxGuests: Number(apt.maxGuests || 2)
        };
    }

    let price = Number(season.price || apt.price || 0);

    if (guestCount === 3 && Number(season.price3 || 0) > 0) {
        price = Number(season.price3);
    }

    if (guestCount === 4 && Number(season.price4 || 0) > 0) {
        price = Number(season.price4);
    }

    if (guestCount === 5 && Number(season.price5 || 0) > 0) {
        price = Number(season.price5);
    }

    if (guestCount >= 6 && Number(season.price6 || 0) > 0) {
        price = Number(season.price6);
    }

    return {
        status: 'OPEN',
        price,
        label: season.name || '',
        minNights: Number(season.minNights || 1),
        maxGuests: Number(season.maxGuests || apt.maxGuests || 2)
    };
}

    function formatDisplayDate(dateStr) {
        if (!dateStr) return '-';

        const d = parseLocalDate(dateStr);

        if (!d || isNaN(d.getTime())) {
            return dateStr;
        }

        return new Intl.DateTimeFormat('de-DE', {
            month: 'short',
            day: 'numeric'
        }).format(d);
    }

    function getDiscountConfig(apt) {
        const discount = apt?.discount || apt?.nightlyDiscount || null;

        if (!discount) {
            return null;
        }

        const isActive =
            discount.active === true ||
            discount.active === 'true' ||
            discount.enabled === true ||
            discount.enabled === 'true';

        if (!isActive) {
            return null;
        }

        const amount = Number(
            discount.amountPerNight ||
            discount.amount ||
            discount.value ||
            apt.discountAmount ||
            0
        );

        if (amount <= 0) {
            return null;
        }

        return {
            amount,
            bookingStart:
                discount.bookingStart ||
                discount.booking_start ||
                discount.start ||
                discount.startDate ||
                '',

            bookingEnd:
                discount.bookingEnd ||
                discount.booking_end ||
                discount.end ||
                discount.endDate ||
                '',

            stayStart:
                discount.stayStart ||
                discount.stay_start ||
                discount.validFrom ||
                '',

            stayEnd:
                discount.stayEnd ||
                discount.stay_end ||
                discount.validTo ||
                ''
        };
    }

    function isDiscountBookingPeriodActive(apt) {
        const discount = getDiscountConfig(apt);

        if (!discount) {
            return false;
        }

        const todayStr = getLocalDateString(new Date());

        if (discount.bookingStart && todayStr < discount.bookingStart) {
            return false;
        }

        if (discount.bookingEnd && todayStr > discount.bookingEnd) {
            return false;
        }

        return true;
    }

    function isDiscountActiveForNight(apt, nightDateStr) {
        const discount = getDiscountConfig(apt);

        if (!discount) {
            return false;
        }

        if (!isDiscountBookingPeriodActive(apt)) {
            return false;
        }

        if (discount.stayStart && nightDateStr < discount.stayStart) {
            return false;
        }

        if (discount.stayEnd && nightDateStr > discount.stayEnd) {
            return false;
        }

        return true;
    }

    function getDiscountAmountForNight(apt, nightDateStr) {
        if (!isDiscountActiveForNight(apt, nightDateStr)) {
            return 0;
        }

        const discount = getDiscountConfig(apt);
        return Number(discount.amount || 0);
    }

    function formatDiscountDate(dateStr) {
        if (!dateStr) return '-';

        const d = parseLocalDate(dateStr);

        if (!d || isNaN(d.getTime())) {
            return dateStr;
        }

        return new Intl.DateTimeFormat('de-DE', {
            year: 'numeric',
            month: 'short',
            day: 'numeric'
        }).format(d);
    }

    function renderDiscountBox() {
        const box = document.getElementById('apt-discount-box');
        const label = document.getElementById('apt-discount-label');
        const main = document.getElementById('apt-discount-main');
        const small = document.getElementById('apt-discount-small');

        if (!box || !label || !main || !small || !currentApt) {
            return;
        }

        const discount = getDiscountConfig(currentApt);

        if (!discount || !isDiscountBookingPeriodActive(currentApt)) {
            box.style.display = 'none';
            return;
        }

        const amountText = discount.amount.toLocaleString('hu-HU');

        label.innerText = `Kedvezmény: -${amountText} Ft / éj`;

        const bookingEndText = discount.bookingEnd
            ? formatDiscountDate(discount.bookingEnd)
            : 'visszavonásig';

        let stayRangeText = 'minden foglalható időszakra';

        if (discount.stayStart && discount.stayEnd) {
            stayRangeText = `${formatDiscountDate(discount.stayStart)} – ${formatDiscountDate(discount.stayEnd)}`;
        } else if (discount.stayStart) {
            stayRangeText = `${formatDiscountDate(discount.stayStart)}`;
        } else if (discount.stayEnd) {
            stayRangeText = `${formatDiscountDate(discount.stayEnd)}`;
        }

        main.innerText = `A kedvezmény akkor érvényes, ha legkésőbb eddig foglalsz: ${bookingEndText}.`;

        small.innerText = `Érvényes tartózkodási időszak: ${stayRangeText}. A kedvezmény csak ezekre az éjszakákra kerül levonásra.`;

        box.style.display = 'block';
    }



    function hasAnyPricedSeason(apt) {
        if (!apt) return false;

        if (Number(apt.price || 0) > 0) {
            return true;
        }

        if (!Array.isArray(apt.seasons)) {
            return false;
        }

        return apt.seasons.some(season =>
            Number(season.price || 0) > 0 ||
            Number(season.price3 || 0) > 0 ||
            Number(season.price4 || 0) > 0 ||
            Number(season.price5 || 0) > 0 ||
            Number(season.price6 || 0) > 0
        );
    }

    function getNextBookableInfo(apt) {
        const today = new Date();

        for (let i = 0; i < 370; i++) {
            const testDate = new Date(today);
            testDate.setDate(today.getDate() + i);

            const dateStr = getLocalDateString(testDate);

            const isBlockedByAdmin = Array.isArray(apt.disabledDates)
                && apt.disabledDates.includes(dateStr);

            if (isBlockedByAdmin) {
                continue;
            }

            const info = getAptStatusAndPrice(apt, testDate);

            if (info.status === 'OPEN' && Number(info.price || 0) > 0) {
                return {
                    ...info,
                    dateStr
                };
            }
        }

        return {
            status: 'CLOSED',
            price: 0,
            label: '',
            minNights: 1,
            maxGuests: 2,
            dateStr: ''
        };
    }

    function renderDetails() {
        if (!currentApt) return;

        const info = getNextBookableInfo(currentApt);

        const setSafeText = (id, text) => {
            const el = document.getElementById(id);
            if (el) el.innerText = text;
        };

        const aptNameEl = document.getElementById('apt-name');

        if (aptNameEl) {
            aptNameEl.innerHTML = formatApartmentName(currentApt.name || 'Ismeretlen apartman');
        }

        setSafeText(
            'apt-loc',
            currentApt.location ||
            ''
        );

        const addressBox = document.getElementById('apt-address-box');
        const addressEl = document.getElementById('apt-address');

        if (currentApt.address && addressBox && addressEl) {
            addressEl.innerText = currentApt.address;
            addressBox.style.display = 'block';
        } else if (addressBox) {
            addressBox.style.display = 'none';
        }

        const descEl = document.getElementById('apt-desc');

        if (descEl) {
            descEl.innerText =
                currentApt.description ||
                'Nincs megadva leírás.';
        }

        const priceTag = document.getElementById('apt-price');
        const bookingBtn = document.getElementById('booking-btn');
        const statusMsg = document.querySelector('.dev-status span:last-child');

        const hasPriceConfig = hasAnyPricedSeason(currentApt);

        if (!hasPriceConfig) {
            if (priceTag) {
                priceTag.innerHTML = `<span style="color:var(--warning)">Ár egyeztetés alatt</span>`;
            }

            if (bookingBtn) {
                bookingBtn.innerText = 'Foglalás nem elérhető';
                bookingBtn.disabled = true;
                bookingBtn.style.opacity = '0.5';
                bookingBtn.style.cursor = 'not-allowed';
                bookingBtn.onclick = null;
            }

            if (statusMsg) {
                statusMsg.innerText = 'Ehhez a szálláshoz még nincs foglalási ár megadva, ezért az online foglalás jelenleg nem elérhető.';
            }
        } else if (info.status === 'OPEN') {
            if (priceTag) {
                const originalPrice = Number(info.price || 0);
                const discountAmount = getDiscountAmountForNight(currentApt, info.dateStr);
                const discountedPrice = Math.max(0, originalPrice - discountAmount);

                if (discountAmount > 0) {
                    priceTag.innerHTML = `
                        <div class="price-old">${originalPrice.toLocaleString('hu-HU')} Ft</div>
                        <div class="price-sale">${discountedPrice.toLocaleString('hu-HU')} Ft</div>
                    `;
                } else {
                    priceTag.innerHTML = `<span class="price-num">${originalPrice.toLocaleString('hu-HU')} Ft</span>`;
                }
            }

            if (bookingBtn) {
                bookingBtn.innerText = 'Foglalás';
                bookingBtn.disabled = false;
                bookingBtn.style.opacity = '1';
                bookingBtn.style.cursor = 'pointer';
                bookingBtn.onclick = openBookingModal;
            }

            if (statusMsg) {
                statusMsg.innerHTML = `
                    <div style="margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px;">
                        <p><strong>Aktuális időszak:</strong> ${info.label || '-'}</p>
                        <p><strong>Kapacitás:</strong> max. ${info.maxGuests || '-'} fő</p>
                        <p><strong>Minimum tartózkodás:</strong> ${info.minNights || '-'} éjszaka</p>
                    </div>
                `;
            }
        } else {
            if (priceTag) {
                priceTag.innerHTML = `<span style="color:var(--warning)">Szezonon kívül</span>`;
            }

            if (bookingBtn) {
                bookingBtn.innerText = 'Jelenleg zárva';
                bookingBtn.disabled = true;
                bookingBtn.style.opacity = '0.5';
                bookingBtn.onclick = null;
            }

            if (statusMsg) {
                statusMsg.innerText = 'Az apartman április 1. és szeptember 30. között fogad vendégeket.';
            }
        }

        allImages = getApartmanImages(currentApt);

        const mainImg = document.getElementById('apt-main-img');
        const fallbackImage = 'img/Hamarosan.png';

        if (mainImg) {
            mainImg.src = allImages[0] || fallbackImage;
            mainImg.alt = decodeHtmlEntities(currentApt.name || 'Balaton Essence apartman');
            mainImg.onclick = () => openLightbox(0);
        }

        const gal = document.getElementById('apt-gallery');

        if (gal) {
            gal.innerHTML = '';

            allImages.slice(1).forEach((imgSrc, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'img-container';

                const img = document.createElement('img');
                img.src = imgSrc;
                img.className = 'gallery-img';
                img.loading = 'lazy';
                img.alt = `${decodeHtmlEntities(currentApt.name || 'Apartman')} galéria ${idx + 2}`;
                img.onclick = () => openLightbox(idx + 1);

                wrapper.appendChild(img);
                gal.appendChild(wrapper);
            });
        }

        renderDiscountBox();
    }

    function openLightbox(index) {
        if (!allImages || allImages.length === 0) return;

        currentIndex = index;

        const lbImg = document.getElementById('lightbox-img');
        const lb = document.getElementById('lightbox');

        if (lbImg && lb) {
            lbImg.src = allImages[currentIndex];
            lb.style.display = 'flex';

            setTimeout(() => {
                lb.classList.add('active');
            }, 10);

            document.body.style.overflow = 'hidden';
        }
    }

    function closeLightbox() {
        const lb = document.getElementById('lightbox');
        if (!lb) return;

        lb.classList.remove('active');

        setTimeout(() => {
            lb.style.display = 'none';
            document.body.style.overflow = 'auto';
        }, 500);
    }

    function changeImage(dir) {
        if (!allImages || allImages.length === 0) return;

        currentIndex = (currentIndex + dir + allImages.length) % allImages.length;

        const lbImg = document.getElementById('lightbox-img');

        if (lbImg) {
            lbImg.src = allImages[currentIndex];
        }
    }

    document.addEventListener('keydown', (e) => {
        const lb = document.getElementById('lightbox');

        if (lb && (lb.style.display === 'flex' || lb.classList.contains('active'))) {
            if (e.key === 'ArrowLeft') changeImage(-1);
            if (e.key === 'ArrowRight') changeImage(1);
            if (e.key === 'Escape') closeLightbox();
        }

        const bookingModal = document.getElementById('booking-modal');

        if (bookingModal && bookingModal.classList.contains('active') && e.key === 'Escape') {
            closeBookingModal();
        }
    });

    function openBookingModal() {
        if (!currentApt) return;

        const modal = document.getElementById('booking-modal');
        const modalAptName = document.getElementById('modal-apt-name');

        if (modalAptName) {
            modalAptName.innerText =
                decodeHtmlEntities(currentApt.name || '');
        }

        selectedStart = null;
        selectedEnd = null;

        document.getElementById('book-start').value = '';
        document.getElementById('book-end').value = '';
        document.getElementById('display-start').innerText = '-';
        document.getElementById('display-end').innerText = '-';

        const info = getNextBookableInfo(currentApt);
        const maxAllowed = Number(info.maxGuests || currentApt.maxGuests || 2);

        const adultsInput = document.getElementById('book-adults');
        const childrenInput = document.getElementById('book-children');
        const nameInput = document.getElementById('book-name');
        const emailInput = document.getElementById('book-email');
        const phoneInput = document.getElementById('book-phone');
        const addressInput = document.getElementById('book-billing-address');
        const msgInput = document.getElementById('book-msg');

        if (adultsInput) {
            adultsInput.max = String(maxAllowed);
            adultsInput.value = String(Math.min(2, maxAllowed));
        }

        if (childrenInput) {
            childrenInput.max = String(Math.max(0, maxAllowed - Number(adultsInput?.value || 1)));
            childrenInput.value = '0';
        }

        if (nameInput) nameInput.value = '';
        if (emailInput) emailInput.value = '';
        if (phoneInput) phoneInput.value = '';
        if (addressInput) addressInput.value = '';
        if (msgInput) msgInput.value = '';

        updateGuestCountInfo();

        modal.style.display = 'flex';

        setTimeout(() => {
            modal.classList.add('active');
        }, 10);

        document.body.style.overflow = 'hidden';

        calDate = new Date();
        selectedStart = null;
        selectedEnd = null;

        const startInput = document.getElementById('book-start');
        const endInput = document.getElementById('book-end');
        const displayStart = document.getElementById('display-start');
        const displayEnd = document.getElementById('display-end');

        if (startInput) startInput.value = '';
        if (endInput) endInput.value = '';
        if (displayStart) displayStart.innerText = '-';
        if (displayEnd) displayEnd.innerText = '-';

        setTimeout(() => {
            renderCalendar();
            calculateStay();
        }, 50);
    }

    function closeBookingModal() {
        const modal = document.getElementById('booking-modal');

        if (!modal) return;

        modal.classList.remove('active');

        setTimeout(() => {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }, 400);
    }

    window.addEventListener('click', function(event) {
        const modal = document.getElementById('booking-modal');

        if (event.target === modal) {
            closeBookingModal();
        }
    });

    function getReservedDatesSet() {
        const bookings = (db.bookings || []).filter(b => String(b.aptId) === String(currentApt.id));
        const reservedDates = new Set();

        bookings.forEach(b => {
            const startRaw = b.checkIn || b.start;
            const endRaw = b.checkOut || b.end;

            const curr = parseLocalDate(startRaw);
            const last = parseLocalDate(endRaw);

            if (!curr || !last || isNaN(curr.getTime()) || isNaN(last.getTime())) {
                return;
            }

            while (curr < last) {
                reservedDates.add(getLocalDateString(curr));
                curr.setDate(curr.getDate() + 1);
            }
        });

        return reservedDates;
    }

    function getBlockedDatesSet() {
        const blockedDates = new Set(Array.isArray(currentApt.disabledDates) ? currentApt.disabledDates : []);
        const reservedDates = getReservedDatesSet();

        reservedDates.forEach(date => blockedDates.add(date));

        return blockedDates;
    }

    function getNoCheckInDatesSet() {
        return new Set(Array.isArray(currentApt.noCheckInDates) ? currentApt.noCheckInDates : []);
    }

    function getNoCheckOutDatesSet() {
        return new Set(Array.isArray(currentApt.noCheckOutDates) ? currentApt.noCheckOutDates : []);
    }

    function isNoCheckInDate(dateStr) {
        return getNoCheckInDatesSet().has(dateStr);
    }

    function isNoCheckOutDate(dateStr) {
        return getNoCheckOutDatesSet().has(dateStr);
    }

    function hasBlockedDateInRange(startStr, endStr) {
        const blockedDates = getBlockedDatesSet();

        const curr = parseLocalDate(startStr);
        const last = parseLocalDate(endStr);

        if (!curr || !last || isNaN(curr.getTime()) || isNaN(last.getTime())) {
            return true;
        }

        while (curr < last) {
            const currStr = getLocalDateString(curr);

            if (blockedDates.has(currStr)) {
                return true;
            }

            curr.setDate(curr.getDate() + 1);
        }

        return false;
    }

    function getCurrentLang() {
        return 'hu';
    }

    function renderCalendar() {
        const daysContainer = document.getElementById('calendar-days');
        const monthYearLabel = document.getElementById('calendar-month-year');

        if (!daysContainer || !monthYearLabel) {
            console.error('Naptár elem hiányzik:', {
                daysContainer,
                monthYearLabel
            });
            return;
        }

        const year = calDate.getFullYear();
        const month = calDate.getMonth();

        const monthName = new Intl.DateTimeFormat(getCurrentLang() === 'hu' ? 'hu-HU' : getCurrentLang() === 'de' ? 'de-DE' : 'en-US', {
            month: 'long'
        }).format(calDate);

        monthYearLabel.innerText = `${monthName} ${year}`;

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const startOffset = firstDay === 0 ? 6 : firstDay - 1;

        const blockedDates = getBlockedDatesSet();
        const noCheckInDates = getNoCheckInDatesSet();
        const noCheckOutDates = getNoCheckOutDatesSet();

        let htmlContent = '';

        for (let i = 0; i < startOffset; i++) {
            htmlContent += `<div class="cal-day empty"></div>`;
        }

        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

            let className = 'cal-day';
            let onClickAttr = `onclick="selectDate('${dateStr}')"`;

            const isTooSoon = !isCheckInAllowedByLeadTime(dateStr);
            const isBlocked = blockedDates.has(dateStr);
            const isNoCheckIn = noCheckInDates.has(dateStr);
            const isNoCheckOut = noCheckOutDates.has(dateStr);

            if (isNoCheckIn && isNoCheckOut) {
                className += ' no-turnover';
            } else if (isNoCheckIn) {
                className += ' no-checkin';
            } else if (isNoCheckOut) {
                className += ' no-checkout';
            }

            let canBeCheckoutDay = false;

            if (
                selectedStart &&
                !selectedEnd &&
                dateStr > selectedStart &&
                isCheckInAllowedByLeadTime(selectedStart) &&
                !hasBlockedDateInRange(selectedStart, dateStr) &&
                !isNoCheckOut
            ) {
                canBeCheckoutDay = true;
            }

            const choosingStart = !selectedStart || selectedEnd || dateStr <= selectedStart;

            if (isTooSoon) {
                className += ' past';
                onClickAttr = '';
            }

            if (choosingStart && isNoCheckIn && !isTooSoon) {
                onClickAttr = '';
            }

            if (selectedStart && !selectedEnd && dateStr > selectedStart && isNoCheckOut && !isBlocked) {
                onClickAttr = '';
            }

            if (isBlocked) {
                className += ' booked';

                if (canBeCheckoutDay) {
                    className += ' end-allowed';
                    onClickAttr = `onclick="selectDate('${dateStr}')"`;
                } else {
                    onClickAttr = '';
                }
            }

            if (selectedStart && dateStr === selectedStart) {
                className += ' selected-start';
            }

            if (selectedEnd && dateStr === selectedEnd) {
                className += ' selected-end';
            }

            if (selectedStart && selectedEnd && dateStr > selectedStart && dateStr < selectedEnd) {
                className += ' selected-range';
            }

            htmlContent += `<div class="${className}" ${onClickAttr}>${d}</div>`;
        }

        daysContainer.innerHTML = htmlContent;
    }

    function selectDate(dateStr) {
        if (!isCheckInAllowedByLeadTime(dateStr)) {
            showSuccess(
                'Túl közeli érkezés',
                'Foglalást legalább 48 órával az érkezés, azaz 14:00 előtt lehet leadni.',
                'error'
            );
            return;
        }

        if (!selectedStart || (selectedStart && selectedEnd)) {
            if (isNoCheckInDate(dateStr)) {
                showSuccess(
                    'Nem érkezési nap',
                    'Ezen a napon nem lehet érkezni. Kérjük, válassz másik érkezési napot.',
                    'error'
                );
                return;
            }

            selectedStart = dateStr;
            selectedEnd = null;
        } else if (dateStr > selectedStart) {
            if (isNoCheckOutDate(dateStr)) {
                showSuccess(
                    'Nem távozási nap',
                    'Ezen a napon nem lehet távozni. Kérjük, válassz másik távozási napot.',
                    'error'
                );
                return;
            }

            if (hasBlockedDateInRange(selectedStart, dateStr)) {
                showSuccess(
                    'Nem választható időszak',
                    'A kiválasztott időszak foglalt vagy letiltott napot tartalmaz.',
                    'error'
                );

                selectedStart = null;
                selectedEnd = null;
            } else {
                selectedEnd = dateStr;
            }
        } else {
            if (isNoCheckInDate(dateStr)) {
                showSuccess(
                    'Nem érkezési nap',
                    'Ezen a napon nem lehet érkezni. Kérjük, válassz másik érkezési napot.',
                    'error'
                );
                return;
            }

            selectedStart = dateStr;
            selectedEnd = null;
        }

        document.getElementById('book-start').value = selectedStart || '';
        document.getElementById('book-end').value = selectedEnd || '';
        document.getElementById('display-start').innerText = selectedStart ? formatDisplayDate(selectedStart) : '-';
        document.getElementById('display-end').innerText = selectedEnd ? formatDisplayDate(selectedEnd) : '-';

        renderCalendar();
        calculateStay();
    }

    function changeMonth(dir) {
        calDate.setMonth(calDate.getMonth() + dir);
        renderCalendar();
    }

    function getApartmentMaxGuests(apt) {
        if (!apt) return 2;

        const candidates = [
            apt.maxGuests,
            apt.max_guests,
            apt.capacity,
            apt.guests
        ];

        if (Array.isArray(apt.seasons)) {
            apt.seasons.forEach(season => {
                candidates.push(season.maxGuests, season.max_guests, season.capacity);

                if (Number(season.price6 || 0) > 0) candidates.push(6);
                if (Number(season.price5 || 0) > 0) candidates.push(5);
                if (Number(season.price4 || 0) > 0) candidates.push(4);
                if (Number(season.price3 || 0) > 0) candidates.push(3);
            });
        }

        const maxGuests = Math.max(
            2,
            ...candidates
                .map(value => Number(value))
                .filter(value => Number.isFinite(value) && value > 0)
        );

        return maxGuests;
    }

    function getBookingGuestBreakdown() {
        const adultsInput = document.getElementById('book-adults');
        const childrenInput = document.getElementById('book-children');

        const maxAllowed = getApartmentMaxGuests(currentApt);

        let adults = parseInt(adultsInput?.value, 10);
        let children = parseInt(childrenInput?.value, 10);

        if (!Number.isFinite(adults) || adults < 1) adults = 1;
        if (!Number.isFinite(children) || children < 0) children = 0;

        if (adults > maxAllowed) adults = maxAllowed;

        const maxChildren = Math.max(0, maxAllowed - adults);

        if (children > maxChildren) {
            children = maxChildren;
        }

        if (adultsInput) {
            adultsInput.min = '1';
            adultsInput.max = String(maxAllowed);
            adultsInput.value = String(adults);
        }

        if (childrenInput) {
            childrenInput.min = '0';
            childrenInput.max = String(maxChildren);
            childrenInput.value = String(children);
        }

        const adultsDisplay = document.getElementById('book-adults-display');
        const childrenDisplay = document.getElementById('book-children-display');

        if (adultsDisplay) adultsDisplay.innerText = String(adults);
        if (childrenDisplay) childrenDisplay.innerText = String(children);

        return {
            adults,
            children,
            total: adults + children,
            maxAllowed
        };
    }

    function changeBookingGuests(type, direction) {
        const guestInfo = getBookingGuestBreakdown();
        const adultsInput = document.getElementById('book-adults');
        const childrenInput = document.getElementById('book-children');

        let adults = guestInfo.adults;
        let children = guestInfo.children;
        const maxAllowed = guestInfo.maxAllowed;

        if (type === 'adults') {
            const nextAdults = adults + direction;

            if (nextAdults < 1) return;
            if (nextAdults + children > maxAllowed) return;

            adults = nextAdults;
        }

        if (type === 'children') {
            const nextChildren = children + direction;

            if (nextChildren < 0) return;
            if (adults + nextChildren > maxAllowed) return;

            children = nextChildren;
        }

        if (adultsInput) adultsInput.value = String(adults);
        if (childrenInput) childrenInput.value = String(children);

        calculateStay();
    }

    function updateGuestCountInfo() {
        const guestInfo = getBookingGuestBreakdown();
        const infoEl = document.getElementById('guest-count-info');

        if (!infoEl) return;

        infoEl.innerText = `Összesen: ${guestInfo.total} fő (${guestInfo.adults} felnőtt, ${guestInfo.children} gyerek)`;

        if (guestInfo.total > guestInfo.maxAllowed) {
            infoEl.style.color = 'var(--warning)';
        } else {
            infoEl.style.color = 'var(--text-light)';
        }
    }

    function calculateStay() {
        const startVal = document.getElementById('book-start').value;
        const endVal = document.getElementById('book-end').value;

        const guestInfo = getBookingGuestBreakdown();
        updateGuestCountInfo();
        const guests = guestInfo.total;

        const btn = document.getElementById('submit-booking-btn');
        const totalBox = document.getElementById('grand-total');
        const infoText = document.getElementById('stay-info');

        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.style.background = '#EAE8E2';
        btn.style.color = '#888';

        if (!startVal || !endVal) {
            infoText.innerText = 'Válassz érkezési és távozási dátumot.';
            totalBox.dataset.finalTotal = '0';
            totalBox.innerText = '0 Ft';
            btn.innerText = 'Válassz dátumot!';
            return;
        }

        const start = parseLocalDate(startVal);
        const end = parseLocalDate(endVal);

        if (!start || !end || isNaN(start.getTime()) || isNaN(end.getTime()) || end <= start) {
            infoText.innerText = 'Érvénytelen dátumválasztás.';
            totalBox.dataset.finalTotal = '0';
            totalBox.innerText = '0 Ft';
            btn.innerText = 'Érvénytelen dátum';
            return;
        }

        if (hasBlockedDateInRange(startVal, endVal)) {
            infoText.innerHTML = `<span style="color:var(--warning)">A kiválasztott időszak foglalt vagy letiltott dátumot tartalmaz.</span>`;
            totalBox.dataset.finalTotal = '0';
            totalBox.innerText = '0 Ft';
            btn.innerText = 'Nem elérhető';
            btn.style.background = 'var(--warning)';
            btn.style.color = 'white';
            return;
        }


        if (isNoCheckInDate(startVal)) {
            infoText.innerHTML = `<span style="color:var(--warning)">A kiválasztott érkezési napon nem lehet érkezni.</span>`;
            totalBox.innerText = '0 Ft';
            totalBox.dataset.finalTotal = '0';
            btn.innerText = 'Nem foglalható';
            btn.style.background = 'var(--warning)';
            btn.style.color = 'white';
            return;
        }

        if (isNoCheckOutDate(endVal)) {
            infoText.innerHTML = `<span style="color:var(--warning)">A kiválasztott távozási napon nem lehet távozni.</span>`;
            totalBox.innerText = '0 Ft';
            totalBox.dataset.finalTotal = '0';
            btn.innerText = 'Nem foglalható';
            btn.style.background = 'var(--warning)';
            btn.style.color = 'white';
            return;
        }

        const nights = Math.ceil((end - start) / (1000 * 60 * 60 * 24));

        let total = 0;
        let originalTotal = 0;
        let discountTotal = 0;
        let minNightsRequired = 1;

        for (let i = 0; i < nights; i++) {
            const currentDay = new Date(start);
            currentDay.setDate(currentDay.getDate() + i);

            const currentDateStr = getLocalDateString(currentDay);
            const info = getAptStatusAndPrice(currentApt, currentDay, guests);

            if (info.status === 'OPEN') {
                const nightlyPrice = Number(info.price || 0);

                if (!Number.isFinite(nightlyPrice) || nightlyPrice <= 0) {
                    infoText.innerHTML = `<span style="color:var(--warning)">A kiválasztott időszakra nincs megadva ár!</span>`;
                    totalBox.innerText = '0 Ft';
                    totalBox.dataset.finalTotal = '0';
                    btn.innerText = 'Nem foglalható';
                    btn.style.background = 'var(--warning)';
                    btn.style.color = 'white';
                    return;
                }

                const nightlyDiscount = getDiscountAmountForNight(currentApt, currentDateStr);
                const finalNightlyPrice = Math.max(0, nightlyPrice - nightlyDiscount);

                originalTotal += nightlyPrice;
                discountTotal += nightlyPrice - finalNightlyPrice;
                total += finalNightlyPrice;

                if (Number(info.minNights || 1) > minNightsRequired) {
                    minNightsRequired = Number(info.minNights || 1);
                }
            } else {
                infoText.innerHTML = `<span style="color:var(--warning)">Az apartman a kiválasztott napokon zárva van.</span>`;
                totalBox.innerText = 'Zárva';
                totalBox.dataset.finalTotal = '0';
                btn.innerText = 'Nem elérhető';
                btn.style.background = 'var(--warning)';
                btn.style.color = 'white';
                return;
            }
        }

        totalBox.dataset.finalTotal = String(total);

        if (discountTotal > 0) {
            totalBox.innerHTML = `
                <div style="font-size:0.9rem; color:#999; text-decoration:line-through; margin-bottom:4px;">
                    ${originalTotal.toLocaleString('hu-HU')} Ft
                </div>
                <div>
                    ${total.toLocaleString('hu-HU')} Ft
                </div>
                <div style="font-size:0.75rem; color:var(--accent); font-family:'Montserrat'; font-weight:700; margin-top:4px;">
                    Kedvezmény: -${discountTotal.toLocaleString('hu-HU')} Ft
                </div>
            `;
        } else {
            totalBox.innerText = `${total.toLocaleString('hu-HU')} Ft`;
        }

        if (nights < minNightsRequired) {
            infoText.innerHTML = `<span style="color:var(--warning)">Ebben az időszakban a minimum tartózkodás ${minNightsRequired} éjszaka.</span>`;
            btn.disabled = true;
            btn.style.opacity = '0.5';
            btn.style.background = 'var(--warning)';
            btn.style.color = 'white';
            btn.innerText = `Mind. ${minNightsRequired} éjszaka`;
            return;
        }

        infoText.innerHTML = `<strong>${nights} éjszaka</strong> kiválasztva.`;
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.style.background = 'var(--accent)';
        btn.style.color = 'white';
        btn.innerText = 'Foglalás elküldése';
    }

    function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || '').trim());
    }

    async function sendBookingRequest() {
        const submitBtn = document.getElementById('submit-booking-btn');
        const totalElement = document.getElementById('grand-total');

        let cleanNumber = Number(totalElement?.dataset.finalTotal || 0);

        const guestInfo = getBookingGuestBreakdown();

        const data = {
            aptId: currentApt.id,
            aptName:
                decodeHtmlEntities(currentApt.name || 'Balaton Essence apartman'),
            guestName: document.getElementById('book-name').value.trim(),
            email: document.getElementById('book-email').value.trim(),
            phone: document.getElementById('book-phone').value.trim(),
            billingAddress: document.getElementById('book-billing-address').value.trim(),
            address: document.getElementById('book-billing-address').value.trim(),
            checkIn: document.getElementById('book-start').value,
            checkOut: document.getElementById('book-end').value,
            guests: String(guestInfo.total),
            adults: guestInfo.adults,
            children: guestInfo.children,
            guestBreakdown: `${guestInfo.adults} felnőtt, ${guestInfo.children} gyerek`,
            totalPrice: cleanNumber,
            msg: document.getElementById('book-msg').value.trim(),
            lang: 'hu',
            source: 'Weboldal (HU)'
        };

        if (!data.guestName || !data.email || !data.phone || !data.billingAddress) {
            showSuccess(
                'Hiányzó adatok',
                'Kérjük, add meg a nevedet, e-mail címedet, telefonszámodat és lakcímedet / számlázási címedet.',
                'error'
            );
            return;
        }

        if (Number(data.adults || 0) < 1) {
            showSuccess(
                'Hiányzó vendégadat',
                'Legalább 1 felnőtt vendéget meg kell adni.',
                'error'
            );
            return;
        }

        if (!isValidEmail(data.email)) {
            showSuccess(
                'Hibás e-mail cím',
                'Kérjük, ellenőrizd az e-mail címet.',
                'error'
            );
            return;
        }

        if (!data.checkIn || !data.checkOut) {
            showSuccess(
                'Hiányzó dátum',
                'Kérjük, válassz érkezési és távozási dátumot.',
                'error'
            );
            return;
        }

        if (!isCheckInAllowedByLeadTime(data.checkIn)) {
            showSuccess(
                'Túl közeli érkezés',
                'Foglalást legalább 48 órával az érkezés, azaz 14:00 előtt lehet leadni.',
                'error'
            );
            return;
        }

        if (hasBlockedDateInRange(data.checkIn, data.checkOut)) {
            showSuccess(
                'Nem választható időszak',
                'A kiválasztott időszak foglalt vagy letiltott dátumot tartalmaz.',
                'error'
            );
            return;
        }


        if (isNoCheckInDate(data.checkIn)) {
            showSuccess(
                'Nem érkezési nap',
                'Ezen a napon nem lehet érkezni. Kérjük, válassz másik érkezési napot.',
                'error'
            );
            return;
        }

        if (isNoCheckOutDate(data.checkOut)) {
            showSuccess(
                'Nem távozási nap',
                'Ezen a napon nem lehet távozni. Kérjük, válassz másik távozási napot.',
                'error'
            );
            return;
        }

        if (data.totalPrice <= 0) {
            showSuccess(
                'Hibás összeg',
                'A foglalás összege nem számolható. Kérjük, válassz másik dátumot vagy frissítsd az oldalt.',
                'error'
            );
            return;
        }

        if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.6';
            submitBtn.innerText = 'Átirányítás a fizetéshez...';
        }

        try {
            const res = await fetch('/api/create-payment-intent-booking', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            const payment = await res.json();

            if (!res.ok || payment.error) {
                showSuccess(
                    'Hiba',
                    payment.error || 'Nem sikerült elindítani a fizetést.',
                    'error'
                );

                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                    submitBtn.innerText = 'Foglalás elküldése';
                }

                return;
            }

            if (!payment.clientSecret) {
                showSuccess(
                    'Hiba',
                    'A fizetési azonosító hiányzik.',
                    'error'
                );

                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                    submitBtn.innerText = 'Foglalás elküldése';
                }

                return;
            }

            const amount = Number(payment.amount || 0);
            const paymentUrl = `/payment.html?kind=booking&lang=hu&amount=${encodeURIComponent(amount)}&client_secret=${encodeURIComponent(payment.clientSecret)}`;
            window.location.href = paymentUrl;
            return;
        } catch (e) {
            console.error(e);

            showSuccess(
                'Hiba',
                'A fizetés indításakor hálózati hiba történt.',
                'error'
            );

            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
                submitBtn.innerText = 'Foglalás elküldése';
            }
        }
    }

    function showSuccess(title, message, type = 'success', callback) {
        const modal = document.getElementById('custom-alert');
        const iconCircle = document.getElementById('alert-icon-circle');
        const btn = document.getElementById('alert-btn');
        const titleEl = document.getElementById('alert-title');
        const msgEl = document.getElementById('alert-msg');

        titleEl.innerText = title;
        msgEl.innerText = message;
        window.alertCallback = callback;

        if (type === 'error') {
            iconCircle.innerText = '✕';
            iconCircle.style.background = '#e74c3c';
            btn.style.background = '#e74c3c';
        } else {
            iconCircle.innerText = '✓';
            iconCircle.style.background = '#27ae60';
            btn.style.background = '#27ae60';
        }

        modal.style.display = 'flex';
    }

    function closeCustomAlert() {
        document.getElementById('custom-alert').style.display = 'none';

        if (window.alertCallback) {
            window.alertCallback();
            window.alertCallback = null;
        }
    }

    function updateSEO(apartmentName, location) {
        document.title = `${apartmentName} - Luxus apartman ${location} | Balaton Essence`;

        let metaDesc = document.querySelector('meta[name="description"]');

        if (!metaDesc) {
            metaDesc = document.createElement('meta');
            metaDesc.setAttribute('name', 'description');
            document.head.appendChild(metaDesc);
        }

        metaDesc.setAttribute(
            'content',
            `Foglalás Sie Ihren Aufenthalt im ${apartmentName} in ${location}. Premium-Unterkunft am Balaton, Strandausrüstung und entspannte Atmosphäre am See.`
        );
    }
