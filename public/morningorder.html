        :root {
            --primary-color: #5c7a4d;
            --primary-light: #769764;
            --accent-color: #d4a373;
            --bg-color: #f4f3ef;
            --text-dark: #2c3325;
            --text-light: #6a7063;
            --surface: rgba(255, 255, 255, 0.85);
            --border: #e3e0d8;
            --danger: #dc3545;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                radial-gradient(at 0% 0%, rgba(212, 163, 115, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(92, 122, 77, 0.1) 0px, transparent 50%);

            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-dark);
        }

        .container {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 100%;
            max-width: 580px;
            padding: 50px 45px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(44, 51, 37, 0.08), inset 0 1px 0 rgba(255,255,255,0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .lang-switcher {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-bottom: 30px;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--text-light);
            transition: all 0.3s ease;
        }

        .lang-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .lang-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 4px 10px rgba(92, 122, 77, 0.2);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--text-dark);
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-light);
            font-size: 14px;
            margin-bottom: 35px;
        }

        .notice {
            background-color: rgba(212, 163, 115, 0.1);
            color: #a67c52;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 30px;
            text-align: center;
            border: 1px solid rgba(212, 163, 115, 0.2);
            letter-spacing: 0.5px;
            line-height: 1.5;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .row .form-floating {
            flex: 1;
        }

        .form-floating {
            position: relative;
            margin-bottom: 25px;
        }

        .form-floating input,
        .form-floating select,
        .form-floating textarea {
            width: 100%;
            padding: 18px 16px 10px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text-dark);
            background-color: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-floating input:focus,
        .form-floating select:focus,
        .form-floating textarea:focus {
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(92, 122, 77, 0.1);

            color: var(--text-light);

        .form-floating label {
            position: absolute;
            top: 50%;

            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 15px;
            transition: all 0.2s ease-out;
            pointer-events: none;
            background: transparent;

        .form-floating textarea ~ label {
            top: 24px;

        .form-floating input:focus ~ label,
        .form-floating input:not(:placeholder-shown) ~ label,

        .form-floating select:valid ~ label,
        .form-floating textarea:focus ~ label,

        button[type="submit"] {

        async function loadPlateOptions() {
            try {
                const response = await fetch('/api/services?t=' + Date.now());

                if (!response.ok) {
                    throw new Error('Nem sikerült betölteni a tálakat.');
                }

                const data = await response.json();

                availablePlates = Array.isArray(data.services?.moments)
                    ? data.services.moments.filter(item => item.active !== false)
                    : [];

                const select = document.getElementById('selectedPlate');

                if (!select) return;

                select.innerHTML = `<option value="" disabled selected></option>`;

                availablePlates.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.id;
                    option.textContent = `${item.name_hu} – ${Number(item.price || 0).toLocaleString('hu-HU')} Ft / tál`;
                    select.appendChild(option);
                });
            } catch (err) {
                console.error('Tálak betöltési hiba:', err);
            }
        }

        function generateTimeOptions(startHour, startMinute, endHour, endMinute, stepMinutes) {
    const options = [];
    const start = new Date(2000, 0, 1, startHour, startMinute, 0);
    const end = new Date(2000, 0, 1, endHour, endMinute, 0);

    const current = new Date(start);

    while (current <= end) {
        const hour = String(current.getHours()).padStart(2, '0');
        const minute = String(current.getMinutes()).padStart(2, '0');
        options.push(`${hour}:${minute}`);
        current.setMinutes(current.getMinutes() + stepMinutes);
    }

    return options;
}

function isBreakfastPlate(plate) {
    const id = normalizeText(plate?.id || '');
    const name = normalizeText(plate?.name_hu || plate?.name_en || plate?.name_de || '');

    return (
        id.includes('breakfast') ||
        id.includes('reggeli') ||
        name.includes('reggeli') ||
        name.includes('breakfast') ||
        name.includes('fruhstuck')
    );
}

function updateDeliveryTimeOptions() {
    const plateId = document.getElementById('selectedPlate').value;
    const deliverySelect = document.getElementById('deliveryTime');

    if (!deliverySelect) return;

    const selectedPlate = availablePlates.find(item => String(item.id) === String(plateId));

    deliverySelect.innerHTML = `<option value="" disabled selected></option>`;

    if (!selectedPlate) {
        return;
    }

    const times = isBreakfastPlate(selectedPlate)
        ? generateTimeOptions(8, 0, 10, 0, 15)
        : generateTimeOptions(8, 0, 20, 0, 30);

    times.forEach(time => {
        const option = document.createElement('option');
        option.value = time;
        option.textContent = time;
        deliverySelect.appendChild(option);
    });
}

        function normalizeText(value) {
            return String(value || '')
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '');
        }

        function parseLocalDate(dateStr) {
            if (!dateStr) return null;

            const parts = String(dateStr).split('-').map(Number);

            if (parts.length !== 3 || parts.some(Number.isNaN)) {
                return null;
            }

            return new Date(parts[0], parts[1] - 1, parts[2]);
        }

        function isFonyodApartmentName(value) {
            return normalizeText(value).includes('fonyod');

        let currentLang = 'hu';
        let fpInstance = null;
        let currentBooking = null;

        const urlParams = new URLSearchParams(window.location.search);
        const bookingId = urlParams.get('id');
        const initialLang = urlParams.get('lang');

        if (['hu', 'en', 'de'].includes(initialLang)) {
            currentLang = initialLang;
        }

        const form = document.getElementById('breakfastForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageEl = document.getElementById('message');

        function getMinDate() {
            const now = new Date();
            const minDate = new Date();

            if (now.getHours() >= 16) {
                minDate.setDate(now.getDate() + 2);
            } else {
                minDate.setDate(now.getDate() + 1);
            }

            return minDate;
        }

        function updateLang(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.title = translations[lang].title;

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;

                if (translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            if (fpInstance) {
                fpInstance.set('locale', lang === 'en' ? 'default' : lang);
            }
        }

        function showMessage(text, type = 'error') {
            messageEl.textContent = text;
            messageEl.style.color = type === 'success' ? 'var(--primary-color)' : 'var(--danger)';
        }

        function clearMessage() {
            messageEl.textContent = '';
        }

        async function loadBookingData() {
            if (!bookingId) {
                showMessage(translations[currentLang].missingBooking);
                submitBtn.disabled = true;
                return;
            }

            try {
                const response = await fetch(`/api/verify-booking/${encodeURIComponent(bookingId)}`);
                const booking = await response.json().catch(() => null);

                if (!response.ok || !booking || booking.valid !== true) {
                    showMessage(translations[currentLang].invalidBooking);
                    submitBtn.disabled = true;
                    return;
                }

                currentBooking = booking;

                document.getElementById('name').value = booking.guestName || '';
                document.getElementById('email').value = booking.email || '';

                document.getElementById('name').readOnly = true;
                document.getElementById('email').readOnly = true;

                apartmentSelect.value = booking.aptName || '';

                if (booking.lang && ['hu', 'en', 'de'].includes(booking.lang) && !initialLang) {
                    updateLang(booking.lang);
                }

                if (booking.breakfastAvailable !== true) {
                    submitBtn.disabled = true;

                    showMessage(
                        currentLang === 'hu'
                            ? 'Reggeli rendelés jelenleg csak fonyódi apartmanokhoz kérhető.'
                            : currentLang === 'de'
                                ? 'Frühstücksbestellungen sind derzeit nur für Apartments in Fonyód verfügbar.'
                                : 'Breakfast orders are currently available only for apartments in Fonyód.'
                    );

                    return;
                }

                clearMessage();
            } catch (err) {
                console.error('Booking verification error:', err);
                showMessage(translations[currentLang].verifyError);
                submitBtn.disabled = true;
            }
        }

        function escapeOrderText(value) {
            return String(value ?? '').trim().replace(/\s+/g, ' ');
        }

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                updateLang(btn.dataset.lang);
            });
        });

        document.getElementById('selectedPlate').addEventListener('change', updateDeliveryTimeOptions);

        document.addEventListener('DOMContentLoaded', async () => {
            await loadPlateOptions();
            await loadBookingData();

            fpInstance = flatpickr("#date", {
            mode: "multiple",
            minDate: getMinDate(),
            dateFormat: "Y-m-d",
            locale: currentLang === 'en' ? 'default' : currentLang,
            conjunction: ", ",
            enable: [
                function(date) {
                    if (!currentBooking?.checkIn || !currentBooking?.checkOut) {
                        return false;
                    }

                    const selectedDay = new Date(
                        date.getFullYear(),
                        date.getMonth(),
                        date.getDate()
                    );

                    const checkIn = parseLocalDate(currentBooking.checkIn);
                    const checkOut = parseLocalDate(currentBooking.checkOut);

                    return selectedDay >= checkIn && selectedDay < checkOut;
                }
            ]
        });

            updateLang(currentLang);
        });

        form.addEventListener('submit', async event => {
            event.preventDefault();
            clearMessage();

            if (!fpInstance) return;

            const selectedDates = [...fpInstance.selectedDates].sort((a, b) => a - b);

            if (selectedDates.length === 0) {
                showMessage(translations[currentLang].selectDate);
                return;
            }

            const plateCount = Number(document.getElementById('guests').value || 0);

            if (!Number.isFinite(plateCount) || plateCount < 1) {
                showMessage(translations[currentLang].genericError);
                return;
            }

            const selectedPlateId = document.getElementById('selectedPlate').value;
            const selectedPlate = availablePlates.find(item => String(item.id) === String(selectedPlateId));

            if (!selectedPlate) {
                showMessage(translations[currentLang].genericError);
                return;
            }

            const deliveryTime = document.getElementById('deliveryTime').value;

            if (!deliveryTime) {
                showMessage(translations[currentLang].selectDeliveryTime);
                return;
            }

            const paymentMethod = document.getElementById('paymentMethod').value;
            const daysCount = selectedDates.length;
            const totalAmount = daysCount * plateCount * Number(selectedPlate.price || 0);

            const formatDate = date => fpInstance.formatDate(date, 'Y-m-d');
            const dateList = selectedDates.map(formatDate).join(', ');

            const orderNote = escapeOrderText(document.getElementById('orderNote').value);
            const phone = escapeOrderText(document.getElementById('phone').value);

            const payload = {
                type: 'BREAKFAST',
                lang: currentLang,
                guestName: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone,
                apartment: apartmentSelect.value,
                start: formatDate(selectedDates[0]),
                end: formatDate(selectedDates[selectedDates.length - 1]),
                days: daysCount,
                items: `${selectedPlate.name_hu} | Napok: ${dateList} | Kiszállítás: ${deliveryTime} | Darab: ${plateCount}${orderNote ? ` | Megjegyzés: ${orderNote}` : ''}`,
                deliveryTime,
                quantity: plateCount,
                plateName: selectedPlate.name_hu,
                method: paymentMethod,
                amount: totalAmount
            };

            submitBtn.disabled = true;
            submitBtn.textContent = translations[currentLang].sending;

            try {
                const response = await fetch('/api/order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json().catch(() => null);

                if (!response.ok || !result || result.success !== true) {
                    showMessage(result?.error || translations[currentLang].genericError);
                    return;
                }

                if (paymentMethod === 'card' && result.clientSecret) {
                    submitBtn.textContent = translations[currentLang].redirecting;
                    const amount = Number(result.amount || payload.amount || 0);
                    window.location.href = `/payment.html?kind=order&lang=${encodeURIComponent(currentLang || 'hu')}&amount=${encodeURIComponent(amount)}&client_secret=${encodeURIComponent(result.clientSecret)}`;
                    return;
                }

                if (paymentMethod === 'card' && result.stripeSessionId) {
                    submitBtn.textContent = translations[currentLang].redirecting;

                    const stripe = Stripe(STRIPE_PUBLIC_KEY);
                    const redirectResult = await stripe.redirectToCheckout({
                        sessionId: result.stripeSessionId
                    });

                    if (redirectResult.error) {
                        showMessage(redirectResult.error.message || translations[currentLang].genericError);
                    }

                    return;
                }

                showMessage(translations[currentLang].success, 'success');

                form.reset();
                fpInstance.clear();
                document.getElementById('deliveryTime').innerHTML = `<option value="" disabled selected></option>`;


                await loadBookingData();
            } catch (err) {
                console.error('Breakfast order error:', err);
                showMessage(translations[currentLang].networkError);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = translations[currentLang].submitBtn;
            }
        });
    </script>
<script src="cookie-consent.js?v=1"></script>
</body>
</html>
